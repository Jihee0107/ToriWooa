<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F4EEDF">
<title>매트 계산기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
  (function(c,l,a,r,i,t,y){
      c[a] = c[a] || function() {
          (c[a].q = c[a].q || []).push(arguments)
      };
      t=l.createElement(r);
      t.async=1;
      t.src="https://www.clarity.ms/tag/"+i;
      y=l.getElementsByTagName(r)[0];
      y.parentNode.insertBefore(t,y);
  })(window, document, "clarity", "script", "prj_IIUE8hkhGAamvubqGQ6kPfAmx9BX");
</script>
<style>
/* 매트 계산기 — 토리매트(그린·옐로우·브라운) / 우아매트(그레이·핑크)
   두 계산기는 같은 틀(아래 <template>)을 쓰고, 색·글꼴·견적서 모양만 브랜드별로 다름
   폰에서 주로 보니까 위아래로 최대한 납작하게 */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    font-size: 15px;
    line-height: 1.45;
    color-scheme: light;
    -webkit-tap-highlight-color: transparent;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }

/* ===== 브랜드 색 ===== */
[data-brand="tori"] {
    --bg: #F4EEDF; --card: #FFFDF8; --field: #FBF6EA; --line: #EADFC9;
    --ink: #3D2B1B; --muted: #8C7761;
    --main: #5A9A3B; --main-deep: #3F7628; --main-soft: #E5F0D8;
    --accent: #F6C944; --accent-ink: #5A3D12;
    --sub: #8A5E36; --sub-soft: #EFE3D0;
    --pick: #5A9A3B; --pick-ink: #FFFFFF;
    --pick2: #F6C944; --pick2-ink: #5A3D12;
    --shadow: 0 1px 2px rgba(90, 60, 25, .06), 0 4px 12px rgba(90, 60, 25, .05);
}
[data-brand="wooa"] {
    --bg: #EEEBEA; --card: #FFFFFF; --field: #F7F5F4; --line: #E3DDDB;
    --ink: #2A2626; --muted: #8B8382;
    --main: #3A3434; --main-deep: #221E1E; --main-soft: #ECE8E7;
    --accent: #FECCBE; --accent-ink: #4A2A22;
    --sub: #A8685A; --sub-soft: #F6E5E0;
    --pick: #FECCBE; --pick-ink: #4A2A22;
    --pick2: #3A3434; --pick2-ink: #FFFFFF;
    --shadow: 0 1px 2px rgba(40, 30, 30, .05), 0 4px 12px rgba(40, 30, 30, .05);
}

.app {
    max-width: 580px;
    margin: 0 auto;
    padding: 0 max(12px, env(safe-area-inset-right)) calc(72px + env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
}

/* ===== 위 막대: 로고 + 탭 (스크롤해도 위에 붙어 있음) ===== */
.top {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; gap: 10px;
    margin: 0 -12px; padding: calc(8px + env(safe-area-inset-top)) 12px 6px;
    background: var(--bg);
}
.brand-logo { flex: none; height: 34px; width: auto; }
[data-brand="wooa"] .brand-logo { height: 44px; margin: -5px -3px; }
.tabs { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; padding: 3px; border-radius: 12px; background: var(--sub-soft); }
.tabs button { border: 0; border-radius: 9px; background: none; padding: 7px 4px; font-size: 14.5px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.tabs button[aria-selected="true"] { background: var(--main); color: #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, .14); }

/* ===== 카드 ===== */
.card {
    margin-top: 8px; padding: 12px;
    background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow);
    scroll-margin-top: 60px;
}

/* ===== 입력 칸 (가로×세로 한 쌍, 매트 수량) ===== */
.box {
    display: flex; align-items: center; gap: 2px;
    min-width: 0; height: 40px; padding: 0 8px;
    border: 1.5px solid var(--line); border-radius: 10px; background: var(--field);
    transition: border-color .15s, box-shadow .15s, background-color .15s;
}
.box:focus-within { border-color: var(--main); background: #fff; box-shadow: 0 0 0 3px var(--main-soft); }
.box input {
    flex: 1; width: 0; min-width: 0; height: 100%; padding: 0 2px;
    border: 0; background: none; outline: none;
    font-size: 16px; font-weight: 700; text-align: center;
    -moz-appearance: textfield; appearance: textfield;
}
.box input::-webkit-outer-spin-button, .box input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.box input::placeholder { color: var(--muted); opacity: .55; font-weight: 500; font-size: 14px; }
.box i, .box em { flex: none; font-style: normal; font-size: 13px; color: var(--muted); }
.box b { flex: none; font-size: 13.5px; font-weight: 800; }

.rooms, .mats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.mats { margin-top: 8px; }
.mat input { text-align: right; }

/* ===== 고르는 버튼 (평형·구간·지역) ===== */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.sizes { display: grid; grid-template-columns: repeat(3, 1fr); }
.chip {
    min-height: 36px; padding: 5px 6px;
    border: 1.5px solid var(--line); border-radius: 10px; background: var(--field);
    font-size: 14px; font-weight: 700; white-space: nowrap;
}
.chip[aria-pressed="true"] { background: var(--pick); border-color: var(--pick); color: var(--pick-ink); }
.parts { margin-top: 6px; }
.parts .chip, .regions .chip { flex: 1; border-radius: 999px; }
.parts .chip[aria-pressed="true"] { background: var(--pick2); border-color: var(--pick2); color: var(--pick2-ink); }

/* ===== 버튼 ===== */
.btns { display: grid; grid-template-columns: 1fr 76px; gap: 6px; margin-top: 8px; }
.btns.three { grid-template-columns: 76px 1fr 76px; }
.btn { height: 44px; padding: 0 8px; border: 0; border-radius: 12px; font-size: 15px; font-weight: 800; white-space: nowrap; transition: transform .08s; }
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .6; }
.btn.primary { background: var(--main); color: #fff; }
.btn.ghost { background: var(--sub-soft); color: var(--sub); }
.btn.add { background: none; border: 1.5px dashed var(--line); color: var(--sub); }
.btn.accent { width: 100%; height: 42px; margin-top: 6px; background: var(--accent); color: var(--accent-ink); }
.btn.line { background: var(--card); border: 1.5px solid var(--line); color: var(--ink); }
.quote-btns { grid-template-columns: 1fr 1fr; }

/* ===== 결과 (한 줄에 매트 하나) ===== */
.res-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 6px 2px; border-bottom: 1px dashed var(--line); }
.res-row:last-child { border-bottom: 0; }
.res-name { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.res-name b { font-size: 15px; font-weight: 800; }
.res-name span { margin-left: 5px; font-size: 12px; color: var(--muted); }
.res-val { flex: none; display: flex; align-items: baseline; gap: 8px; font-variant-numeric: tabular-nums; }
.res-val b { font-size: 18px; font-weight: 800; color: var(--main-deep); }
.res-val b small { margin-left: 1px; font-size: 13px; font-weight: 700; }
.res-val span { min-width: 84px; text-align: right; font-size: 13.5px; font-weight: 700; color: var(--sub); }
.res-row.zero .res-val b { color: var(--muted); }

/* ===== 상담 문구 ===== */
.msgs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.msg {
    min-height: 42px; padding: 4px 6px;
    border: 1.5px solid var(--line); border-radius: 12px; background: var(--field);
    font-size: 14px; font-weight: 700; word-break: keep-all;
    transition: background-color .15s, border-color .15s;
}
.msg.done { border-color: var(--main); background: var(--main-soft); }

.foot { margin-top: 12px; text-align: center; font-size: 11px; color: var(--muted); }

@media (hover: hover) {
    .chip:hover, .msg:hover { border-color: var(--main); }
    .tabs button:hover:not([aria-selected="true"]) { color: var(--ink); }
}
@media (max-width: 350px) {
    .tabs button { font-size: 13.5px; }
    .chip, .msg { font-size: 13px; }
    .btns.three { grid-template-columns: 64px 1fr 64px; }
    .res-val span { min-width: 76px; font-size: 12.5px; }
}

/* ===== 알림 · 전환 버튼 (브랜드 이름·색 없이 "전환"만 — 고객 앞에서 다른 매트사가 안 보이게) ===== */
.toast {
    position: fixed; left: 50%; bottom: calc(72px + env(safe-area-inset-bottom)); z-index: 20;
    max-width: calc(100% - 40px); padding: 10px 16px; border-radius: 999px;
    background: rgba(30, 26, 24, .92); color: #fff; font-size: 14px; font-weight: 600; text-align: center;
    opacity: 0; transform: translate(-50%, 10px); pointer-events: none;
    transition: opacity .2s, transform .2s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.brand-fab {
    position: fixed; right: max(12px, env(safe-area-inset-right)); bottom: calc(14px + env(safe-area-inset-bottom)); z-index: 15;
    width: 46px; height: 46px; padding: 0;
    border: 1px solid rgba(0, 0, 0, .08); border-radius: 50%;
    background: rgba(255, 255, 255, .94); color: #6A6462;
    font-size: 12.5px; font-weight: 700;
    box-shadow: 0 2px 8px rgba(0, 0, 0, .16);
}
.brand-fab:active { transform: scale(.93); }

/* ===== 견적서 (사진 저장용) =====
   항상 520px로 만들고, 화면이 좁으면 글자를 줄이는 대신 통째로 축소해서 보여줌 */
.quote-wrap { position: relative; overflow: hidden; margin-top: 8px; }
.quote-sheet { width: 520px; transform-origin: top left; text-align: left; }
.quote-sheet p { margin: 0; }
.quote-title { margin: 0; }
.quote-table { width: 100%; table-layout: fixed; }
.quote-table th, .quote-table td { text-align: center; word-break: keep-all; overflow-wrap: normal; line-height: 1.3; }
.quote-table th:nth-child(1) { width: 23%; }
.quote-table th:nth-child(2) { width: 19%; }
.quote-table th:nth-child(3) { width: 11%; }
.quote-table th:nth-child(4) { width: 19%; }
.quote-table th:nth-child(5) { width: 28%; }
.quote-note { white-space: pre-line; }
.quote-note:empty { display: none; }

/* 토리매트 견적서 — 내추럴 */
[data-brand="tori"] .quote-sheet { padding: 26px 24px 22px; background: #FFFDF6; border: 2px solid #D3E6C1; border-radius: 22px; font-family: 'Gowun Dodum', sans-serif; color: #4A3421; }
[data-brand="tori"] .quote-head { text-align: center; padding-bottom: 14px; margin-bottom: 10px; border-bottom: 2px dashed #EDD898; }
[data-brand="tori"] .quote-logo { display: block; max-height: 64px; max-width: 200px; margin: 0 auto 8px; }
[data-brand="tori"] .quote-title { font-size: 26px; font-weight: 400; letter-spacing: 1px; color: #5A3B1F; }
[data-brand="tori"] .quote-table { border-collapse: separate; border-spacing: 0 6px; }
[data-brand="tori"] .quote-table th { padding: 9px 3px; background: #E3F0D5; color: #3D6E25; font-size: 13px; font-weight: 400; }
[data-brand="tori"] .quote-table th:first-child { border-radius: 10px 0 0 10px; }
[data-brand="tori"] .quote-table th:last-child { border-radius: 0 10px 10px 0; }
[data-brand="tori"] .quote-table td { padding: 11px 3px; background: #fff; border-top: 1px solid #EFE5D1; border-bottom: 1px solid #EFE5D1; font-size: 13.5px; }
[data-brand="tori"] .quote-table td:first-child { border-left: 3px solid #F6C944; border-radius: 10px 0 0 10px; font-size: 12.5px; }
[data-brand="tori"] .quote-table td:last-child { border-right: 1px solid #EFE5D1; border-radius: 0 10px 10px 0; color: #3F7628; font-weight: 700; }
[data-brand="tori"] .quote-foot { margin-top: 10px; padding-top: 14px; border-top: 2px dashed #EDD898; font-size: 13px; line-height: 1.8; color: #6B4E33; text-align: center; word-break: keep-all; }
[data-brand="tori"] .quote-brand { font-size: 15px; font-weight: 700; color: #3F7628; }

/* 우아매트 견적서 — 미니멀 (그레이·핑크) */
[data-brand="wooa"] .quote-sheet { padding: 6px; background: #fff; border: 1px solid #2A2626; font-family: 'Nanum Myeongjo', serif; color: #2A2626; }
[data-brand="wooa"] .quote-inner { padding: 26px 24px 22px; border: 1px solid #2A2626; }
[data-brand="wooa"] .quote-head { position: relative; text-align: center; padding: 12px 0 16px; margin-bottom: 16px; border-bottom: 1px solid #2A2626; }
[data-brand="wooa"] .quote-head::after { content: ''; display: block; width: 46px; height: 2px; margin: 12px auto 0; background: #E7A595; }
[data-brand="wooa"] .quote-logo { position: absolute; top: -16px; right: -8px; height: 72px; width: auto; }
[data-brand="wooa"] .quote-title { font-size: 21px; font-weight: 800; letter-spacing: 6px; }
[data-brand="wooa"] .quote-table { border-collapse: collapse; }
[data-brand="wooa"] .quote-table th { padding: 10px 3px; border-bottom: 2px solid #2A2626; font-size: 12px; font-weight: 700; letter-spacing: 2px; }
[data-brand="wooa"] .quote-table td { padding: 12px 3px; border-bottom: 1px solid #E5DFDD; font-size: 12.5px; font-weight: 700; }
[data-brand="wooa"] .quote-table td:last-child { color: #B26A5A; }
[data-brand="wooa"] .quote-foot { margin-top: 18px; padding-top: 14px; border-top: 1px solid #2A2626; font-size: 12.5px; font-weight: 700; line-height: 2; letter-spacing: .5px; text-align: center; word-break: keep-all; }
[data-brand="wooa"] .quote-brand { font-size: 14px; font-weight: 800; letter-spacing: 4px; }
[data-brand="wooa"] .quote-note { max-width: 94%; margin: 12px auto; padding: 12px 10px; border-top: 1px solid #F1D5CD; border-bottom: 1px solid #F1D5CD; text-align: left; }
</style>
</head>
<body data-brand="tori">
<div id="apps"></div>
<button type="button" id="brand-fab" class="brand-fab" aria-label="전환">전환</button>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<!-- 계산기 틀 — 토리·우아가 이걸 하나씩 복사해서 씀 -->
<template id="app-tpl">
    <header class="top">
        <img class="brand-logo" alt="">
        <nav class="tabs" role="tablist">
            <button type="button" role="tab" data-tab="calculator">계산기</button>
            <button type="button" role="tab" data-tab="estimate">양식</button>
            <button type="button" role="tab" data-tab="message">상담</button>
        </nav>
    </header>

    <!-- 계산기: 가로·세로(cm) 칸 4개(+ 추가) → 50cm 칸 수로 바꿔 매트 장수 -->
    <section data-panel="calculator">
        <div class="card">
            <div class="rooms"></div>
            <div class="btns three">
                <button type="button" class="btn add" data-act="room-add">+ 추가</button>
                <button type="button" class="btn primary" data-act="calc">계산하기</button>
                <button type="button" class="btn ghost" data-act="calc-reset">초기화</button>
            </div>
        </div>
        <div class="card calc-result" hidden>
            <div class="result" data-out="calc"></div>
            <button type="button" class="btn accent" data-act="calc-copy">결과 복사하기</button>
        </div>
    </section>

    <!-- 양식: 평형 고르기(또는 수량 직접) → 금액 → 지역 고르면 견적서 사진 -->
    <section data-panel="estimate">
        <div class="card">
            <div class="chips sizes"></div>
            <div class="chips parts" hidden></div>
            <div class="mats"></div>
            <div class="btns">
                <button type="button" class="btn primary" data-act="est">견적 계산하기</button>
                <button type="button" class="btn ghost" data-act="est-reset">초기화</button>
            </div>
        </div>
        <div class="card est-result" hidden>
            <div class="result" data-out="est"></div>
            <button type="button" class="btn accent" data-act="est-copy">결과 복사하기</button>
        </div>
        <div class="card quote-card" hidden>
            <div class="chips regions"></div>
            <div class="quote-wrap" hidden>
                <div class="quote-sheet">
                    <div class="quote-inner">
                        <div class="quote-head">
                            <img class="quote-logo" alt="">
                            <h3 class="quote-title"></h3>
                        </div>
                        <table class="quote-table">
                            <thead><tr><th>매트 종류</th><th>규격</th><th>수량</th><th>단가</th><th>금액</th></tr></thead>
                            <tbody class="quote-body"></tbody>
                        </table>
                        <div class="quote-foot">
                            <p class="quote-brand"></p>
                            <div class="quote-lines"></div>
                            <p class="quote-note"></p>
                            <p class="quote-phone"></p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="btns quote-btns" hidden>
                <button type="button" class="btn primary" data-act="img-save">📷 사진으로 저장</button>
                <button type="button" class="btn line" data-act="img-copy">📋 사진으로 복사</button>
            </div>
        </div>
    </section>

    <!-- 상담: 누르면 문구 복사 -->
    <section data-panel="message">
        <div class="card">
            <div class="msgs"></div>
        </div>
    </section>

    <footer class="foot">by_지희</footer>
</template>

<script>
'use strict';

/* ===== 브랜드 설정 =====
   mats: area = 50×50cm 칸 몇 개 넓이인지, plus = 계산된 장수에 더 얹는 장수
   presets: 평형 → 구간별 장수 (mats 순서대로) */
const BRANDS = {
    tori: {
        name: '토리매트', store: 'green', color: '#F4EEDF',
        phone: '☎ 1544-0074',
        mats: [
            { key: 70, name: '자이언트', size: '70×70', price: 36000, area: 1.96 },
            { key: 80, name: '자이언트플러스', size: '80×80', price: 50000, area: 2.56 },
            { key: 100, name: '빅토리', size: '100×100', price: 82000, area: 3.8 },
            // 빅토리아 140×100 = 우아매트 120매트 장수(80매트 ÷ 2.18) + 1장
            { key: 140, name: '빅토리아', size: '140×100', price: 118000, area: 2.56 * 2.18, plus: 1 }
        ],
        presets: {
            '25평/59㎡': { '거복': [52, 40, 27, 19], '거복주': [65, 50, 33, 23] },
            '30평/74㎡': { '거복': [58, 45, 31, 21], '거복주': [78, 60, 41, 28] },
            '34평/84㎡': { '거복': [65, 50, 34, 23], '거복아': [78, 60, 41, 28], '거복주': [88, 68, 45, 32] },
            '30평후': { '거복': [75, 58, 40, 27], '거복주': [97, 75, 51, 35] },
            '40평초': { '거복': [82, 63, 43, 29], '거복주': [104, 80, 54, 37] },
            '40평중후': { '거복': [88, 68, 45, 32], '거복주': [111, 85, 58, 40] }
        },
        // 견적서 아래 지역별 안내 문구
        regions: {

const MIN_ROOMS = 4;   // 계산기 탭 가로×세로 칸 기본 개수

function won(n) { return n.toLocaleString('ko-KR') + '원'; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

// 50×50cm 칸 수 → 매트 장수 (1e-9: 소수 계산 오차로 한 장 덜 나오는 것 방지)
function matCount(m, cells) { return cells > 0 ? Math.floor(cells / m.area + 1e-9) + (m.plus || 0) : 0; }
// 매트 장수 → 50×50cm 칸 수 (matCount 거꾸로)
function cellsOf(m, n) { n -= m.plus || 0; return n > 0 ? n * m.area : 0; }

const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};

let toastTimer;
function notify(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

function copyText(text, msg) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;font-size:16px;pointer-events:none';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    ta.remove();
    if (ok) return notify(msg);
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => notify(msg), () => notify('복사하지 못했어요'));
    else notify('복사하지 못했어요');
}

/* ===== 계산기 하나 (브랜드마다 하나씩) ===== */
function createApp(key) {
    const cfg = BRANDS[key];
    const el = document.createElement('div');
    el.className = 'app';
    el.dataset.brand = key;
    el.hidden = true;
    el.append(document.getElementById('app-tpl').content.cloneNode(true));
    const $ = s => el.querySelector(s);
    const $$ = s => [...el.querySelectorAll(s)];
    const field = id => $(`[data-id="${id}"]`);
    const num = id => parseFloat(field(id).value) || 0;

    // 로고 · 견적서 브랜드
    $('.brand-logo').src = $('.quote-logo').src = LOGOS[key];
    $('.brand-logo').alt = $('.quote-logo').alt = cfg.name;
    $('.quote-title').textContent = cfg.name + ' 견적서';
    $('.quote-brand').textContent = cfg.name;
    $('.quote-lines').innerHTML = cfg.quoteLines.map(t => `<p>${esc(t)}</p>`).join('');
    $('.quote-phone').textContent = cfg.phone;

    $('.mats').innerHTML = cfg.mats.map(m => `
        <label class="box mat"><b>${m.key}매트</b><input type="number" inputmode="numeric" data-id="mat${m.key}" data-mat="${m.key}" placeholder="0" aria-label="${m.name} 장수"><em>장</em></label>`).join('');
    $('.sizes').innerHTML = Object.keys(cfg.presets).map(s => `<button type="button" class="chip" data-size="${s}" aria-pressed="false">${s}</button>`).join('');
    $('.regions').innerHTML = Object.keys(cfg.regions).map(r => `<button type="button" class="chip" data-region="${r}" aria-pressed="false">${r}</button>`).join('');
    $('.msgs').innerHTML = Object.keys(cfg.messages).map(k => `<button type="button" class="msg" data-msg="${esc(k)}">${esc(k)}</button>`).join('');

    // 매트 수량은 브랜드별로 기억 — 예전 계산기와 같은 이름(green_mat80, pink_mat120 …)
    const inputs = $$('input[data-id]');
    const save = () => inputs.forEach(i => store.set(cfg.store + '_' + i.dataset.id, i.value));
    inputs.forEach(i => {
        const v = store.get(cfg.store + '_' + i.dataset.id);
        if (v && v !== '0') i.value = v;
        i.addEventListener('input', () => { syncMats(+i.dataset.mat); save(); });
    });

    // 매트 하나를 고치면 나머지는 같은 넓이로 바꿔서 채움
    function syncMats(src) {
        const from = cfg.mats.find(m => m.key === src);
        const cells = cellsOf(from, num('mat' + src));
        cfg.mats.forEach(m => { if (m !== from) field('mat' + m.key).value = cells > 0 ? matCount(m, cells) : ''; });
    }

    // 계산기 탭 가로×세로 칸 — 4개로 시작, "+ 추가"로 늘림 (값은 green_rooms / pink_rooms에 기억)
    const roomKey = cfg.store + '_rooms';
    function addRoom(w = '', h = '') {
        const d = document.createElement('div');
        d.className = 'box pair';
        d.innerHTML = '<input type="number" inputmode="numeric" placeholder="가로" aria-label="가로(cm)"><i>×</i><input type="number" inputmode="numeric" placeholder="세로" aria-label="세로(cm)">';
        const [a, b] = d.querySelectorAll('input');
        a.value = w;
        b.value = h;
        $('.rooms').append(d);
        return a;
    }
    const roomVals = () => $$('.rooms .pair').map(p => [...p.querySelectorAll('input')].map(i => i.value));
    function saveRooms() {
        const rows = roomVals();
        while (rows.length > MIN_ROOMS && !rows[rows.length - 1].join('')) rows.pop();   // 끝의 빈 칸은 안 남김
        store.set(roomKey, JSON.stringify(rows));
    }
    let savedRooms = [];
    try { savedRooms = JSON.parse(store.get(roomKey)) || []; } catch (e) {}
    for (let i = 0; i < Math.max(MIN_ROOMS, savedRooms.length); i++) addRoom(...(savedRooms[i] || []));
    $('.rooms').addEventListener('input', saveRooms);
    $('.rooms').addEventListener('focusin', e => { e.target.value = ''; });   // 누르면 비워서 바로 입력

    function showTab(t) {
        $$('.tabs [data-tab]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === t)));
        $$('[data-panel]').forEach(p => { p.hidden = p.dataset.panel !== t; });
        scaleQuote();
    }

    const resultHtml = list => list.map(({ m, n }) => `
        <div class="res-row${n ? '' : ' zero'}">
            <div class="res-name"><b>${m.name}</b><span>${m.size}</span></div>
            <div class="res-val"><b>${n}<small>장</small></b><span>${won(n * m.price)}</span></div>
        </div>`).join('');
    // 결과가 화면 아래에 생기면 보이게 내려줌
    const reveal = node => { if (node.getBoundingClientRect().bottom > innerHeight - 60) node.scrollIntoView({ behavior: 'smooth', block: 'start' }); };

    // 계산기 탭
    let calcRes = null;
    function calcRooms() {
        let cells = 0;
        roomVals().forEach(([w, h]) => { cells += Math.ceil((parseFloat(w) || 0) / 50) * Math.ceil((parseFloat(h) || 0) / 50); });
        calcRes = cfg.mats.map(m => ({ m, n: matCount(m, cells) }));
        $('[data-out="calc"]').innerHTML = resultHtml(calcRes);
        $('.calc-result').hidden = false;
        reveal($('.calc-result'));
    }
    function resetCalc() {
        $('.rooms').innerHTML = '';
        for (let i = 0; i < MIN_ROOMS; i++) addRoom();
        saveRooms();
        calcRes = null;
        $('.calc-result').hidden = true;
    }

    // 양식 탭
    let estRes = null;
    function pickSize(size) {
        $$('.sizes .chip').forEach(c => c.setAttribute('aria-pressed', String(c.dataset.size === size)));
        $('.parts').dataset.size = size;
        $('.parts').innerHTML = Object.keys(cfg.presets[size]).map(p => `<button type="button" class="chip" data-part="${p}" aria-pressed="false">${p}</button>`).join('');
        $('.parts').hidden = false;
    }
    function pickPart(part) {
        const vals = cfg.presets[$('.parts').dataset.size][part];
        $$('.parts .chip').forEach(c => c.setAttribute('aria-pressed', String(c.dataset.part === part)));
        cfg.mats.forEach((m, i) => { field('mat' + m.key).value = vals[i]; });
        save();
    }
    function calcEstimate() {
        estRes = cfg.mats.map(m => ({ m, n: parseInt(field('mat' + m.key).value) || 0 }));
        $('[data-out="est"]').innerHTML = resultHtml(estRes);
        $('.est-result').hidden = $('.quote-card').hidden = false;
        hideQuote();
        reveal($('.est-result'));
    }
    function resetEstimate() {
        cfg.mats.forEach(m => { field('mat' + m.key).value = ''; });
        save();
        estRes = null;
        $$('.sizes .chip').forEach(c => c.setAttribute('aria-pressed', 'false'));
        $('.parts').hidden = true;
        $('.est-result').hidden = $('.quote-card').hidden = true;
        hideQuote();
    }
    function hideQuote() {
        $$('.regions .chip').forEach(c => c.setAttribute('aria-pressed', 'false'));
        $('.quote-wrap').hidden = $('.quote-btns').hidden = true;
        $('.quote-wrap').style.height = '';
    }
    // 지역을 고르면 견적서 표시 (지역별 안내 문구가 견적서 아래에 들어감)
    function selectRegion(r) {
        if (!estRes || !estRes.some(x => x.n > 0)) return notify('먼저 견적 계산하기를 눌러주세요');
        $$('.regions .chip').forEach(c => c.setAttribute('aria-pressed', String(c.dataset.region === r)));
        $('.quote-body').innerHTML = estRes.filter(x => x.n > 0).map(({ m, n }) =>
            `<tr><td>${m.name}</td><td>${m.size}cm</td><td>${n}장</td><td>${won(m.price)}</td><td>${won(n * m.price)}</td></tr>`).join('');
        $('.quote-note').textContent = cfg.regions[r];
        $('.quote-wrap').hidden = $('.quote-btns').hidden = false;
        scaleQuote();
    }
    function scaleQuote() {
        const wrap = $('.quote-wrap'), sheet = $('.quote-sheet');
        if (wrap.hidden || !wrap.clientWidth) return;
        sheet.style.transform = 'none';
        const s = Math.min(1, wrap.clientWidth / sheet.offsetWidth);
        sheet.style.transform = `scale(${s})`;
        wrap.style.height = sheet.offsetHeight * s + 'px';
    }
    window.addEventListener('resize', scaleQuote);

    function copyMsg(btn) {
        const k = btn.dataset.msg;
        copyText(cfg.messages[k], `'${k}' 문구를 복사했어요`);
        btn.classList.add('done');
        setTimeout(() => btn.classList.remove('done'), 1200);
    }

    const ACTS = {
        'room-add': () => { addRoom().focus(); saveRooms(); },
        'calc': calcRooms,
        'calc-reset': resetCalc,
        'calc-copy': () => calcRes && copyText(calcRes.map(({ m, n }) => cfg.calcCopy(m, n)).join('\n'), '결과를 복사했어요'),
        'est': calcEstimate,
        'est-reset': resetEstimate,
        'est-copy': () => estRes && copyText(estRes.map(({ m, n }) => cfg.estCopy(m, n)).join(cfg.estJoin), '결과를 복사했어요'),
        'img-save': b => saveQuoteImage($('.quote-sheet'), cfg.name, b),
        'img-copy': b => copyQuoteImage($('.quote-sheet'), b)
    };
    el.addEventListener('click', e => {
        const b = e.target.closest('button');
        if (!b) return;
        const d = b.dataset;
        if (d.tab) showTab(d.tab);
        else if (d.act) ACTS[d.act](b);
        else if (d.size) pickSize(d.size);
        else if (d.part) pickPart(d.part);
        else if (d.region) selectRegion(d.region);
        else if (d.msg) copyMsg(b);
    });

    showTab('estimate');
    return { el, onShow: scaleQuote };
}

/* ===== 견적서 사진 ===== */
// html2canvas가 CDN 문제로 안 불러졌으면 저장·복사할 때 다른 CDN으로 다시 시도
function ensureHtml2Canvas() {
    if (typeof html2canvas !== 'undefined') return Promise.resolve();
    const urls = [
        'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',
        'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js',
        'https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js'
    ];
    const tryLoad = i => new Promise((resolve, reject) => {
        if (i >= urls.length) return reject(new Error('lib'));
        const s = document.createElement('script');
        s.src = urls[i];
        s.onload = () => resolve();
        s.onerror = () => resolve(tryLoad(i + 1));
        document.head.appendChild(s);
    });
    return tryLoad(0);
}

// 화면에선 축소돼 있으니 원래 크기(520px)로 돌려놓고 2배로 찍음
function renderQuote(node) {
    const prev = node.style.transform;
    node.style.transform = 'none';
    return html2canvas(node, { scale: 2, backgroundColor: '#ffffff' })
        .then(cv => new Promise((resolve, reject) => cv.toBlob(b => b ? resolve(b) : reject(new Error('blob')), 'image/png')))
        .finally(() => { node.style.transform = prev; });
}

// 삼성 인터넷 등은 내려받기 전에 확인 창을 띄우는데, 그 사이 Blob 주소가 사라지면 조용히 실패
// → 사라지지 않는 data URL로 내려받음
function downloadBlob(blob, fileName) {
    return new Promise(resolve => {
        const reader = new FileReader();
        reader.onload = () => {
            try {
                const a = document.createElement('a');
                a.download = fileName;
                a.href = reader.result;
                document.body.appendChild(a);
                a.click();
                a.remove();
            } catch (e) {
                // 내려받기가 막힌 경우: 새 탭에 그림을 띄워 길게 눌러 저장
                const win = window.open();
                if (win) win.document.write('<img src="' + reader.result + '" style="max-width:100%;">');
                else notify('저장하지 못했어요. 팝업 차단을 해제한 뒤 다시 해 주세요');
            }
            resolve();
        };
        reader.onerror = () => { notify('저장하지 못했어요'); resolve(); };
        reader.readAsDataURL(blob);
    });
}

// 아이폰은 공유창의 "이미지 저장"으로 사진 앱에 바로 저장, 그 밖(안드로이드·PC)은 내려받기
function saveQuoteImage(node, brandName, btn) {
    const label = btn.textContent;
    const done = () => { btn.disabled = false; btn.textContent = label; };
    btn.disabled = true;
    btn.textContent = '만드는 중…';
    ensureHtml2Canvas().then(() => renderQuote(node)).then(blob => {
        const d = new Date();
        const fileName = `${brandName}_견적서_${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}.png`;
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        let file = null, canShare = false;
        try {
            file = new File([blob], fileName, { type: 'image/png' });
            canShare = isIOS && !!(navigator.share && navigator.canShare && navigator.canShare({ files: [file] }));
        } catch (e) {}
        if (!canShare) return downloadBlob(blob, fileName).then(done);
        return navigator.share({ files: [file], title: brandName + ' 견적서' }).then(done, err => {
            if (err && err.name === 'AbortError') return done();   // 공유창을 닫은 것
            return downloadBlob(blob, fileName).then(done);
        });
    }).catch(err => {
        notify(err && err.message === 'lib' ? '이미지 기능을 불러오지 못했어요. 인터넷 연결을 확인해 주세요' : '이미지를 만들지 못했어요');
        done();
    });
}

// 아이폰(사파리)은 누른 그 순간에 clipboard.write를 불러야 해서, 그림은 다 만들어지면 채워지도록 Promise로 넘김
function copyQuoteImage(node, btn) {
    if (!navigator.clipboard || typeof ClipboardItem === 'undefined') return notify('이 기기에서는 사진 복사가 안 돼요. 사진으로 저장을 써 주세요');
    const label = btn.textContent;
    const done = () => { btn.disabled = false; btn.textContent = label; };
    btn.disabled = true;
    btn.textContent = '복사 중…';
    const blob = ensureHtml2Canvas().then(() => renderQuote(node));
    try {
        navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })])
            .then(() => notify('견적서 사진을 복사했어요'), () => notify('복사하지 못했어요. 사진으로 저장을 써 주세요'))
            .then(done);
    } catch (e) {
        notify('복사하지 못했어요. 사진으로 저장을 써 주세요');
        done();
    }
}

/* ===== 브랜드 전환 (오른쪽 아래 "전환" 버튼) ===== */
const apps = {}, scrollPos = {};
let current = null;
function switchBrand(k) {
    if (current) scrollPos[current] = window.scrollY;
    current = k;
    Object.keys(apps).forEach(key => { apps[key].el.hidden = key !== k; });
    document.body.dataset.brand = k;
    document.querySelector('meta[name="theme-color"]').content = BRANDS[k].color;
    window.scrollTo(0, scrollPos[k] || 0);
    apps[k].onShow();
}
function start() {
    const box = document.getElementById('apps');
    Object.keys(BRANDS).forEach(k => { apps[k] = createApp(k); box.append(apps[k].el); });
    document.getElementById('brand-fab').addEventListener('click', () => switchBrand(current === 'tori' ? 'wooa' : 'tori'));
    switchBrand('tori');
    if (document.fonts) document.fonts.ready.then(() => apps[current].onShow());   // 글꼴이 늦게 오면 견적서 높이 다시 맞춤
}
